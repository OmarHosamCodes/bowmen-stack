version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    container_name: bowmen_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bowmen_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bowmen_network
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: bowmen_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - bowmen_network
    restart: unless-stopped
    command: redis-server --appendonly yes

networks:
  bowmen_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data: